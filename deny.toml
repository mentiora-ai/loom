# cargo-deny configuration. Enforces:
#   - the chromiumoxide-only-in-loom-shims rule (Chromium driver lives
#     out-of-process, in one crate)
#   - no platform-specific keychain crates outside loom-keychain
#   - no `getrandom` reachable from WASM-guest surfaces
# License + advisory checks are enforced too; see [licenses] / [advisories].

[graph]
# All-features evaluation so feature-gated keychain backends are visible
# to the wrapper-allowlist rules (otherwise cargo-deny v2 reports the
# `loom-keychain` wrappers as unmatched).
all-features = true
no-default-features = false

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = []

[licenses]
version = 2
# Exhaustive allow-list under v2 — any license not listed is denied.
# GPL-2.0/3.0, AGPL, LGPL, etc. fall through to the default-deny so the
# release artifacts stay license-clean.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Unicode-3.0",
    "MPL-2.0",
    "Zlib",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
# Path-only internal deps were treated as wildcards under cargo-deny v2 until
# `[workspace.dependencies]` learned to carry `version = "0.9.0"` for each
# loom-* path entry. With those pinned, this can be tightened back to "deny"
# in a future PR. Held at "warn" for now to keep the upgrade window open.
wildcards = "warn"
highlight = "all"

# Known-duplicate transitive deps introduced by the v0.9.4 keychain backends.
# Each pair is split across two co-existing major-version lineages that we
# can't easily unify without forcing a major bump elsewhere in the tree.
# Listed here so cargo-deny doesn't promote the `multiple-versions` warning
# tier into a CI failure under EmbarkStudios/cargo-deny-action@v2's default
# exit-code semantics. Re-evaluate whenever the secret-service / wasmtime /
# wit-bindgen chains land a unifying release.
skip = [
    # secret-service 5.x pulls `digest 0.10 → block-buffer 0.10`; the rest of
    # the workspace (sha2 0.11 via loom-shims / loom-cli / loom-keychain) is
    # on `digest 0.11 → block-buffer 0.12`. Both sides are mature, both ship.
    { name = "block-buffer", version = "=0.10.4" },
    # cpp_demangle: wasmtime 44 pins 0.4.5 (in its addr2line vendor); top-
    # level addr2line 0.26 pulls 0.5.1. Independent symbol-demangle paths.
    { name = "cpp_demangle", version = "=0.4.5" },
    # cpufeatures: aes 0.8 (secret-service) on 0.2.17; sha1 0.10 (soketto /
    # tungstenite) on 0.2.17 too — but jsonrpsee 0.26's sub-tree pulls 0.3.0.
    { name = "cpufeatures", version = "=0.2.17" },
    # windows_*_*: rustix 1.x pulls 0.52.6; older `windows-sys 0.42` chain
    # (via `dbus / zbus 5.15` on Linux) still references 0.42.2. Pure target-
    # cfg leaves — Linux runs neither in practice; macOS/Windows pick one or
    # the other depending on which cfg gate evaluates true at build.
    { name = "windows_i686_msvc", version = "=0.42.2" },
    { name = "windows_x86_64_gnu", version = "=0.42.2" },
    { name = "windows_x86_64_gnullvm", version = "=0.42.2" },
    { name = "windows_x86_64_msvc", version = "=0.42.2" },
    # winnow: toml 1.x (workspace) on 1.0.3; cargo-platform / cargo-metadata
    # transitives still on 0.7.x. Parser-combinator only; build-time only.
    { name = "winnow", version = "=0.7.15" },
    # wit-bindgen: wasmtime's wit-component vendors 0.51 internally; the
    # workspace top-level `wit-bindgen = "0.57"` is what the WASM-guest
    # surfaces use. Two separate consumers, no fight to reconcile.
    { name = "wit-bindgen", version = "=0.51.0" },
    # wit-parser: same story as wit-bindgen — 0.246 vendored by
    # wasmtime-environ 44; 0.247 is the workspace top-level.
    { name = "wit-parser", version = "=0.246.2" },
]

# ---- Per-crate / per-target bans ----
# These rules encode the workspace's architectural invariants. cargo-deny
# v2 matches `wrappers` against DIRECT parents in the resolved dep graph —
# transitive ancestors are not implicit wrappers. The lists below name the
# direct parents on the host target; `secret-service` and `windows-credentials`
# don't appear in the macOS/Linux graph respectively, so their `loom-keychain`
# wrappers exist as architectural documentation and produce a benign
# `unused-wrapper` warning on hosts where they're not built.

# 1. chromiumoxide may ONLY appear in loom-shims (out-of-process
#    Chromium driver). Forbid in every other crate.
[[bans.deny]]
name = "chromiumoxide"
wrappers = ["loom-shims"]

# 2. The WASM guest (loom-surface-web) MUST NOT depend on `getrandom` —
#    randomness comes from the host's `host::rng-next-u64` only.
#    The wrappers list enumerates all current direct parents on the
#    macOS+Linux host targets — none of which reach the guest,
#    which is what enforces the architectural rule. New direct
#    parents will fail this ban and require a review here.
[[bans.deny]]
name = "getrandom"
wrappers = [
    "rand",            # rand 0.10 reaches getrandom directly (was via rand_core in 0.9)
    "rand_core",       # rand → ulid, jsonrpsee, etc.
    "ahash",           # jsonschema RNG seeding
    "redox_users",     # dirs Redox-OS path resolution
    "ring",            # crypto / vault
    "tempfile",        # temp file naming
    "jsonschema",      # schema validation engine RNG
    "jsonschema-value", # jsonschema 0.57+ value layer (host-side only)
    "referencing",     # jsonschema URI resolution helpers
    "jobserver",       # build-time make-jobserver client
    "secret-service",  # Linux keychain backend (v0.9.4) — uses getrandom for session-AES IV
]

# 3. Forbid platform-specific keychain crates outside loom-keychain.
#    `rustls-platform-verifier` and `rustls-native-certs` are also
#    allowed because they use these crates for OS-level TLS certificate
#    verification, not keychain ops.
[[bans.deny]]
name = "security-framework"
wrappers = ["loom-keychain", "rustls-platform-verifier", "rustls-native-certs"]

[[bans.deny]]
name = "security-framework-sys"
wrappers = ["loom-keychain", "rustls-platform-verifier", "security-framework"]

[[bans.deny]]
name = "secret-service"
wrappers = ["loom-keychain"]

[[bans.deny]]
name = "windows-credentials"
wrappers = ["loom-keychain"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
