name: CI

# ── Per-job time budgets ──────────────────────────────────────────────────
# Baseline measured 2026-06-11 (runs 27328345698 / 27326452136, warm cache).
# If a job drifts past its budget, treat it as a perf regression and find
# out why before raising the number.
#
# 2026-06-22: the Rust compile jobs (test/build/smoke/e2e) now build with the
# `[profile.ci-fast]` profile (Cargo.toml) instead of `release`: same opt-level
# (3) but `lto=false` + `codegen-units=16`, linked with `lld` on Linux. This
# kills the fat-LTO compile that dominated the test job (~35 min running 373
# single-threaded whole-program LTO passes — one per test binary). The
# `measured` column below is the PRE-ci-fast baseline; the `target` column is
# the post-change expectation. ⚠️ UPDATE the measured numbers from the first
# ci-fast CI run (then drop this note's "target" framing). Shipped binaries are
# unaffected — release.yml builds from [profile.dist] (lto=thin).
#
#   job                       measured      target   notes
#   cargo test (ubuntu)       warm ~6.5m    ≤ 14     COMPILE-bound. MEASURED
#                             cold ~18m              2026-06-23: the whole
#                                                    `--run-ignored all` suite
#                                                    EXECUTES in ~47s (nextest
#                                                    Summary); the 335s→1076s
#                                                    "Run tests" swing is
#                                                    test-binary compile/link.
#                                                    sccache (content-keyed)
#                                                    fills the COLD gap that
#                                                    wipes rust-cache's target.
#                                                    opt-level stays 3 so
#                                                    perf-SLA tests stay green.
#                                                    ⚠️ UPDATE measured after a
#                                                    warm-sccache run.
#   cargo test (macos)        35-45 min     ≤ 30     main pushes + ci:macos label
#                                                    only; ci-fast speedup but no
#                                                    lld (native linker).
#   build (ubuntu/macos)       4-7 min      ≤ 8      ci-fast + lld (linux)
#   smoke (ubuntu)             4-9 min      ≤ 10     ci-fast; rebuild + daemon RPC
#   e2e pinned-chromium       10-11 min     ≤ 14     ci-fast; chromium dl cached
#   clippy                     1-3 min      ≤ 6
#   gen-docs                   ~1 min       ≤ 4
#   vendored-wasm staleness    ~30 s        ≤ 3
#   cargo-deny                 ~35 s        ≤ 3
#   pytest / node:test         10-35 s      ≤ 3      each SDK suite
#   fmt / lint scripts / etc.  4-15 s       ≤ 2
#
# Wall-clock for a default Rust-touching PR was ≈ the ubuntu test leg (~30 min);
# post-ci-fast it should be bounded by the build→e2e chain instead. SDK-only /
# docs-only PRs ≈ 1 min (path filters skip the Rust matrix). Beta toolchain runs
# weekly in rust-beta.yml, not here.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `labeled` is non-default: adding the `ci:macos` label must re-trigger
    # CI so the macOS `test` leg (PR-skipped by default, see the test job
    # matrix) can be pulled into a PR on demand. Any other label addition
    # also re-triggers, but the per-ref concurrency group above cancels the
    # superseded run, so the cost is a restart, not a duplicate.
    types: [opened, synchronize, reopened, labeled]

# Cancel superseded runs on the same ref (force-pushes to a PR branch, and
# pushes to main). Main is included deliberately: merges are batched with
# local gating, so a batch of N pushes used to spawn N full runs (each with a
# unique per-SHA group) that queued for hours — only the newest main run
# matters, the rest self-cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default. Individual jobs can elevate if needed.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # ── Compile-cache levers (2026-06-23) ─────────────────────────────────────
  # The Rust `test` job is COMPILE-bound, not execution-bound: the whole
  # `--run-ignored all` suite EXECUTES in ~47s (nextest Summary line); the
  # 335s→1076s swing in the "Run tests" step is test-binary compile/link. The
  # painful runs are the COLD ones — a Cargo.lock change or a foundational-crate
  # edit invalidates Swatinem/rust-cache's whole target dir → full recompile.
  #
  # sccache is a CONTENT-keyed compilation cache (GitHub Actions cache backend):
  # it caches per-crate rustc outputs by input hash, so it still HITS across the
  # cache-key changes that wipe rust-cache's target — exactly the cold/heavy
  # runs. rust-cache stays (registry + same-lock target fast-path); sccache is
  # the fallback that fills the cold gap. RUSTC_WRAPPER is set globally but only
  # consulted when rustc actually runs — the compiling jobs all install sccache
  # (the step added before every rust-cache below); fmt/deny don't compile so
  # the wrapper is never invoked there.
  #
  # CARGO_INCREMENTAL=0 is REQUIRED by sccache (incremental artifacts aren't
  # cacheable) and is a good CI default anyway (incremental is useless on fresh
  # runners and bloats the rust-cache target dir). Shipped binaries unaffected
  # (release.yml builds from [profile.dist]).
  CARGO_INCREMENTAL: 0
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  # ── PR path filtering ───────────────────────────────────────────────────
  # PR runs skip job groups whose inputs cannot have changed (SDK-only PRs
  # skip the Rust matrix and vice versa). Pushes to main always run every
  # job: main runs self-cancel under the concurrency group above, so the
  # newest push's own diff does not cover the batch it superseded — the
  # filter is only trustworthy for PR diffs.
  #
  # This job always runs and always succeeds, so every PR gets at least one
  # green status even when all heavy jobs are filtered out.
  #
  # The SDK filters deliberately include the Rust wire-type files their
  # drift tests parse (python-sdk/tests/test_types_drift.py reads
  # loom-shared/src/error_format.rs + loom-rpc/src/rpc_handlers/
  # rpc_handlers.rs; typescript-sdk/tests/test_types_drift.ts reads
  # error_format.rs) so an error-code or admin-RPC change still runs both
  # SDK suites.
  changes:
    name: detect changed paths
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      e2e: ${{ steps.filter.outputs.e2e }}
      docs: ${{ steps.filter.outputs.docs }}
      python_sdk: ${{ steps.filter.outputs.python_sdk }}
      typescript_sdk: ${{ steps.filter.outputs.typescript_sdk }}
    steps:
      # No checkout needed: on pull_request the action lists changed files
      # via the API. The step is skipped on push (outputs stay empty) — every
      # downstream `if` short-circuits on event_name first.
      - uses: dorny/paths-filter@v4
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            rust: &rust
              - 'loom-*/**'
              - 'wit/**'
              - 'mocks/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'deny.toml'
              - '.github/workflows/ci.yml'
            e2e:
              - *rust
              - 'tests/e2e/**'
            docs:
              - 'docs/**'
            python_sdk:
              - 'python-sdk/**'
              - 'loom-shared/src/error_format.rs'
              - 'loom-rpc/src/rpc_handlers/**'
              - '.github/workflows/ci.yml'
            typescript_sdk:
              - 'typescript-sdk/**'
              - 'loom-shared/src/error_format.rs'
              - '.github/workflows/ci.yml'

  fmt:
    name: rustfmt
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    # `cargo fmt` doesn't compile, and this job doesn't install sccache — disable
    # the global RUSTC_WRAPPER so any cargo rustc-probe never looks for sccache.
    env:
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-wasip2
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: Swatinem/rust-cache@v2
        with:
          # Keep the warm cache even when clippy finds something — the
          # fix-up push should not recompile the dep tree from cold.
          cache-on-failure: true
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev
      - run: cargo clippy --workspace --all-targets -- -D warnings

  no-platform-imports:
    # Catches stray `use AppKit::*` / `use Foundation::*` / etc. in
    # loom-host or loom-core — those crates must stay platform-free,
    # with platform code routed through loom-keychain or loom-shims.
    # cargo-deny enforces dep-graph bans; this is the source-text gate.
    name: no-platform-imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/lint_no_platform_imports.py
      # W7.5: verification test plants a known violation and asserts the
      # lint catches it. Stops the v0.9.3-class regression where the lint
      # silently scanned zero files (SCAN_DIRS path bug per A-W8 / D40).
      - run: python3 scripts/test_lint_no_platform_imports.py

  test:
    name: cargo test (${{ matrix.os }} / ${{ matrix.toolchain }})
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    # Hung-compile backstop (the header budgets are advisory; there was none).
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The macOS test leg is the single most expensive cell in this file
        # (~42 min wall, $0.16/min, and the public-repo macOS concurrency cap
        # is 5 jobs — it serialized the whole queue). PRs run Linux only by
        # default; macOS test coverage is preserved on every push to main and
        # can be pulled into a PR on demand with the `ci:macos` label (the
        # `labeled` pull_request type above re-triggers CI when it lands).
        # macOS-specific *compile* breakage is still caught on every PR by
        # the macOS leg of the `build` job below, which stays.
        os: ${{ (github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'ci:macos')) && fromJSON('["ubuntu-latest"]') || fromJSON('["macos-latest", "ubuntu-latest"]') }}
        # Beta-toolchain coverage moved to the weekly rust-beta.yml workflow:
        # it was informational-only (continue-on-error) yet cost a full
        # ~35-min workspace compile+test on every PR push. `toolchain` stays
        # a matrix axis so job names ("cargo test (… / stable)") are stable.
        toolchain: [stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      # Default key already fingerprints toolchain (rustc hash) + Cargo.lock,
      # scoped per job id — verified in run 27328345698 (key
      # v0-rust-test-Linux-x64-<rustc>-<lock>). `cache-on-failure` is the
      # repair: a red test run used to discard the entire warm compile.
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install system deps (linux only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          # `pkg-config libssl-dev` for openssl-sys; the rest are runtime libs
          # for the pinned Chromium binary downloaded by `loom postinstall`
          # in the e2e job. Installed here too so the cache restored from the
          # e2e job lets the fake-chromium tests find a runnable browser if
          # they ever switch off the mock. `libasound2t64` (not `libasound2`)
          # for ubuntu-24. `ffmpeg`: the screencast encoder (ffmpeg-sidecar)
          # otherwise downloads ffmpeg at RUNTIME, which flakes when the CDN is
          # down and used to red the recording e2e tests. A system ffmpeg on PATH
          # means `resolve_ffmpeg()` skips the download entirely AND lets the
          # real encode/webm round-trip be exercised deterministically.
          sudo apt-get install -y \
            pkg-config libssl-dev lld \
            ffmpeg \
            libnss3 libgbm1 libasound2t64 \
            libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libxcomposite1 libxdamage1 libxss1 \
            libxkbcommon-x11-0 libx11-xcb1 \
            fonts-liberation xdg-utils \
            libdbus-1-3 dbus-x11 gnome-keyring libsecret-tools
      # Use lld for linking (linux only). With fat LTO off (the ci-fast profile
      # below), link time of the 373 test binaries is the next pole — lld cuts it.
      # A job RUSTFLAGS env REPLACES (does NOT merge) .cargo/config.toml's
      # build.rustflags, so we re-list -Dwarnings -Wunused or the per-compile
      # warning gate silently weakens. The grep is the regression canary: a future
      # edit that drops -Dwarnings from RF fails the job loudly. macOS keeps its
      # native linker (this step is linux-gated) but still gets the no-LTO speedup.
      - name: Configure lld linker + preserve warning gate (linux only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          RF="-Dwarnings -Wunused -Clink-arg=-fuse-ld=lld"
          echo "$RF" | grep -q -- '-Dwarnings' || { echo "::error::RUSTFLAGS lost -Dwarnings"; exit 1; }
          echo "RUSTFLAGS=$RF" >> "$GITHUB_ENV"
      # W7.1 / A-W7.2: Linux Secret Service test infra. `timeout 60s`
      # bounds the gnome-keyring-daemon start so a runner-image regression
      # (IPC_LOCK lockdown, missing libsecret, etc.) can NEVER hang CI.
      # On success, propagate `KEYCHAIN_CI_REQUIRE_DAEMON=1` so the Linux
      # backend tests run for real instead of self-skipping; on failure
      # (timeout / non-zero exit), exit 0 with a clear stderr line and
      # leave the env var unset so the tests self-skip with
      # `tracing::info!` (per the W3.10 / A-W3.1 contract). Failed setup
      # ≠ failed PR — the Linux backend has a documented weaker-CI gap
      # per D9, and macOS coverage exercises 70% of the same trait surface.
      - name: Start gnome-keyring (linux only, best-effort)
        if: matrix.os == 'ubuntu-latest'
        run: |
          set +e
          # `eval` not `export $(...)` — if dbus-launch fails or prints
          # nothing, `export $(...)` would silently export empty values
          # (council-ship #2: empty DBUS env then masks the underlying
          # failure as a "test infra works but keyring won't unlock"
          # symptom). With `eval`, an empty stdout is a no-op and the
          # subsequent gnome-keyring-daemon call hits the real error.
          dbus_out=$(dbus-launch --sh-syntax 2>/dev/null)
          if [ -z "$dbus_out" ]; then
            echo "dbus-launch produced no output; Linux backend tests will self-skip." >&2
            echo "  see A-W7.2 / FND-0047 — failed setup is non-blocking for v0.9.4." >&2
            exit 0
          fi
          eval "$dbus_out"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> $GITHUB_ENV
          echo "DBUS_SESSION_BUS_PID=$DBUS_SESSION_BUS_PID" >> $GITHUB_ENV
          timeout 60s bash -c '
            echo "" | gnome-keyring-daemon --unlock --components=secrets --daemonize
          '
          ec=$?
          if [ $ec -eq 0 ]; then
            echo "KEYCHAIN_CI_REQUIRE_DAEMON=1" >> $GITHUB_ENV
            echo "gnome-keyring-daemon up; Linux backend tests will run (not skip)."
          else
            echo "gnome-keyring start failed (exit=$ec); Linux backend tests will self-skip." >&2
            echo "  see A-W7.2 / FND-0047 — failed setup is non-blocking for v0.9.4." >&2
          fi
          exit 0
      - name: Build fake-chromium binary
        # The 23 `#[ignore]`'d tests in loom-host locate this binary via
        # `current_exe().parent()/"fake-chromium"`. `--profile ci-fast` puts it
        # next to the test binaries' parent dir (target/ci-fast/), so it stays a
        # sibling of the ci-fast-built test binaries below.
        run: cargo build -p loom-shims --features fake-chromium-bin --bin fake-chromium --profile ci-fast
      - name: Install cargo-nextest
        # Pinned by major tag to match this repo's action-pinning convention
        # (actions/checkout@v6, Swatinem/rust-cache@v2, …).
        uses: taiki-e/install-action@v2.86.5
        with:
          tool: nextest
      - name: Run tests (nextest, parallel + --run-ignored)
        # nextest runs each test in its OWN process. That process isolation is
        # what makes the suite parallel-safe (it neutralizes process-global
        # state — env vars, OnceLock caches, umask, tracing callsite interest),
        # so we no longer need `--test-threads=1` (retired; see CONTRIBUTING.md).
        # Running tests in parallel is the whole point: this was the slowest CI
        # leg by far.
        # `--features 'loom-shims/fake-chromium-bin'`: required for the loom-shims
        # test crates (e.g. binary_smoke) to compile at all.
        # `--run-ignored all`: the nextest equivalent of libtest's
        # `--include-ignored` — runs the fake-chromium ignored tests (the e2e signal).
        # `--profile ci`: its `default-filter` (in .config/nextest.toml) excludes the
        # two `loom-host/tests/v8_seed_determinism.rs` Phase-6 stubs that `panic!()`,
        # replacing the old `--skip one_hundred_runs_with_same_seed --skip two_sessions_seed_42`.
        # `--cargo-profile ci-fast`: build the test binaries with the no-fat-LTO profile
        # (the ~35-min compile lever). NOTE the two distinct flags — nextest's `--profile`
        # is its own profile (the filter above); cargo's `--cargo-profile` is the build
        # profile. opt-level stays 3 (ci-fast inherits release) so perf-SLA tests stay green.
        run: cargo nextest run --workspace --cargo-profile ci-fast --features 'loom-shims/fake-chromium-bin' --profile ci --run-ignored all
      - name: Run doctests (nextest does not run them)
        # `cargo nextest run` cannot execute doctests; run them separately so
        # the `///` doc examples stay covered. Same ci-fast profile (plain `cargo
        # test` uses `--profile`, not nextest's `--cargo-profile`).
        run: cargo test --workspace --profile ci-fast --features 'loom-shims/fake-chromium-bin' --doc

  build:
    name: cargo build --release (${{ matrix.os }} / ${{ matrix.toolchain }})
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        # The macOS leg stays on PRs deliberately (unlike `test`): it is the
        # only per-PR check that compiles the platform-specific code paths
        # (loom-keychain / loom-shims) on macOS, and at ~5 min it is an order
        # of magnitude cheaper than the macOS test leg it backstops.
        os: [macos-latest, ubuntu-latest]
        # Beta moved to the weekly rust-beta.yml workflow — see the note on
        # the `test` job matrix.
        toolchain: [stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      # `shared-key` (instead of the default per-job key) lets the `smoke`
      # job restore this exact release-profile dep cache rather than
      # maintaining a near-identical copy — fewer multi-GB cache entries
      # under the repo's 10 GB cap means less eviction thrash for everyone.
      # Toolchain hash + Cargo.lock stay in the key automatically.
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-deps
          cache-on-failure: true
      - name: Install system deps (linux only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev lld
      # See the test job for the rationale: lld + re-listed warning flags
      # (a job RUSTFLAGS env replaces .cargo/config.toml's build.rustflags).
      - name: Configure lld linker + preserve warning gate (linux only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          RF="-Dwarnings -Wunused -Clink-arg=-fuse-ld=lld"
          echo "$RF" | grep -q -- '-Dwarnings' || { echo "::error::RUSTFLAGS lost -Dwarnings"; exit 1; }
          echo "RUSTFLAGS=$RF" >> "$GITHUB_ENV"
      # ci-fast (no fat LTO) — this job only verifies compile+link, not perf, so
      # it does not need the release profile. Shipped binaries come from
      # release.yml ([profile.dist], lto=thin) and are unaffected.
      - run: cargo build --workspace --profile ci-fast
      - name: Verify binaries are present
        run: |
          for bin in loom loom-daemon loom-shim-chromium loom-mcp; do
            test -f "target/ci-fast/$bin" || (echo "missing: $bin"; exit 1)
            file "target/ci-fast/$bin"
          done

  smoke:
    name: end-to-end smoke (${{ matrix.os }})
    needs: [changes, build]
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        # PRs validate on Linux only; macOS is added on push-to-main so we
        # catch macOS-specific regressions at merge time without paying the
        # macOS bill on every PR (and every rebase).
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["macos-latest", "ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      # Same shared key as `build` (which this job `needs`) — restores the
      # exact dep cache `build` just saved instead of keeping a duplicate.
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-deps
          cache-on-failure: true
      - name: Install system deps (linux only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev jq lld
      # See the test job for the rationale: lld + re-listed warning flags.
      - name: Configure lld linker + preserve warning gate (linux only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          RF="-Dwarnings -Wunused -Clink-arg=-fuse-ld=lld"
          echo "$RF" | grep -q -- '-Dwarnings' || { echo "::error::RUSTFLAGS lost -Dwarnings"; exit 1; }
          echo "RUSTFLAGS=$RF" >> "$GITHUB_ENV"
      - name: Build binaries (ci-fast)
        # ci-fast (no fat LTO); smoke exercises functional behavior, not perf.
        run: cargo build --profile ci-fast
      # Don't `loom postinstall` (would download Chromium ~150 MB) — the
      # `e2e` job below covers the real-Chromium path. Smoke verifies the
      # daemon comes up + the offline RPC surface (session lifecycle,
      # doctor) works without a real browser.
      - name: Daemon comes up + accepts RPC
        shell: bash
        run: |
          set -euo pipefail
          BIN=./target/ci-fast
          $BIN/loom serve > /tmp/loom-daemon.log 2>&1 &
          sleep 5
          # doctor passes for socket+daemon, fails for chromium
          $BIN/loom doctor || echo "expected: chromium check fails (no postinstall)"
          # session lifecycle WITHOUT actions (offline)
          S=$($BIN/loom session create --profile standard | jq -r .session_id)
          echo "session=$S"
          test -n "$S" -a "$S" != "null"
          $BIN/loom session list | jq 'length' | grep -E '^[1-9]'
          $BIN/loom session inspect "$S" | jq -r '.session_id' | grep -q "$S"
          # validate honors the D-7 output contract: piped/non-TTY emits JSON
          # (a bare "PASS" string was the pre-fix bug). Assert the structured field.
          $BIN/loom session validate "$S" --json | jq -e '.passed == true'
          $BIN/loom session close "$S" | jq -r '.status' | grep -q closed
          # gc smoke (no blobs to collect on a freshly-created session)
          $BIN/loom gc --ttl 0 | jq -r '.blobs_collected'
          # Cleanup
          pkill -9 -f loom-daemon || true
      - name: Print daemon log on failure
        if: failure()
        run: cat /tmp/loom-daemon.log || true

  # ensure docs/actions.md and the man pages match the registry.
  # `loom-rpc/src/action_registry/action_registry.rs` is the source of truth;
  # the example regenerates everything; the diff check fails the PR if a
  # registry edit was committed without re-running the generator.
  gen-docs:
    name: docs/actions.md and man pages are up to date
    needs: changes
    # Generated docs are a pure function of Rust code, so any Rust change can
    # invalidate them; a hand-edit under docs/ must also be re-checked. Both
    # paths gate here — SDK-only / README-only PRs cannot go stale.
    if: >-
      github.event_name != 'pull_request' ||
      needs.changes.outputs.rust == 'true' ||
      needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # `cache-on-failure`: this job fails *after* a successful build when
      # docs/ are stale — without it the fix-up push recompiles from cold.
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev
      - name: Regenerate docs
        # `cargo run` propagates the example's exit code, so a non-zero
        # exit from gen-docs (registry malformed, render failure) fails
        # this step before the diff check below ever runs.
        # Dev profile (no --release): text generation doesn't benefit
        # from optimisations and faster CI feedback matters.
        run: cargo run --example gen-docs -p loom-cli
      - name: Fail on stale generated artefacts
        run: |
          # Diff the entire docs/ directory rather than a hardcoded file
          # list — keeps this in sync with the dynamic subcommand-walking
          # man-page generator. New CLI subcommands automatically appear
          # in docs/ and are covered here without editing this workflow.
          # `git add -N` registers untracked files as intent-to-add so the
          # diff also fails when the generator emits a brand-new man page
          # (e.g. docs/loom-newverb.1) that was never committed — plain
          # `git diff` only sees tracked files and would pass falsely.
          git add -N docs/
          if ! git diff --exit-code -- docs/; then
            echo "::error::Generated docs in docs/ are out of date. Run 'cargo run --example gen-docs -p loom-cli' and commit the result."
            exit 1
          fi

  readme-version:
    name: README versions match the workspace version
    runs-on: ubuntu-latest
    # Standalone, lightweight analogue of gen-docs (fail-on-mismatch). It does
    # NOT extend gen-docs: gen-docs regenerates docs from code; this compares
    # README prose against the single source-of-truth version so README version
    # strings can't silently lag a release. No toolchain/build needed.
    steps:
      - uses: actions/checkout@v7
      - name: Self-test the version checker
        run: scripts/check-readme-version.test.sh
      - name: README version strings match Cargo.toml
        run: |
          set -euo pipefail
          # Source of truth: the workspace [workspace.package] version.
          version="$(awk -F'"' '/^\[workspace\.package\]/{f=1} f&&/^version[[:space:]]*=/{print $2; exit}' Cargo.toml)"
          if [ -z "$version" ]; then
            echo "::error::could not parse [workspace.package] version from Cargo.toml"
            exit 1
          fi
          echo "source-of-truth version: $version"
          scripts/check-readme-version.sh "$version" README.md

  uninstall-script:
    name: uninstall.sh self-test
    runs-on: ubuntu-latest
    # Lightweight analogue of readme-version: exercises the destructive
    # uninstaller hermetically (throwaway $HOME, --dry-run deletes nothing)
    # so a regression in its path resolution can't ship an rm -rf that wipes
    # the wrong directory. No toolchain/build needed.
    steps:
      - uses: actions/checkout@v7
      - name: Self-test the uninstaller
        run: scripts/uninstall.test.sh

  e2e:
    # Real-Chromium-pinned end-to-end verification. Stable toolchain only
    # (beta coverage lives in the weekly rust-beta.yml and skips e2e).
    name: e2e pinned-chromium (${{ matrix.os }})
    needs: [changes, build]
    # Runs when Rust code OR tests/e2e fixtures change. The explicit
    # `needs.build.result` check (instead of the implicit success() gate)
    # lets a fixtures-only PR run e2e even though `build` was path-skipped —
    # this job compiles its own binaries, `needs: build` is ordering/gating
    # only. A genuinely failed build still skips e2e.
    if: >-
      !cancelled() &&
      (github.event_name != 'pull_request' || needs.changes.outputs.e2e == 'true') &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        # See `smoke.matrix.os` — macOS only on push-to-main. The e2e job is
        # the heaviest macOS consumer (downloads Chromium + runs the full
        # shell harness), so PR-time skipping is the biggest single savings.
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["macos-latest", "ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    # The tests/e2e/*.sh harness scripts default LOOM/MCP to
    # `$WORKSPACE/target/release/loom[-mcp]` (via `${LOOM_BIN:-…}`). Since this job
    # now builds with `--profile ci-fast` (binaries land in target/ci-fast/), point
    # the override hooks there. Set at job level so all three harness steps
    # (run_e2e / run_load / run_mcp) inherit it on both OSes. NOTE: the script
    # defaults stay `target/release` on purpose — the scheduled e2e-real-world.yml
    # still builds `--release` and relies on that default.
    env:
      LOOM_BIN: ${{ github.workspace }}/target/ci-fast/loom
      LOOM_MCP_BIN: ${{ github.workspace }}/target/ci-fast/loom-mcp
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      # Deliberately NOT on the `release-deps` shared key: this job also
      # compiles dev-profile loom-cli deps for `verify_url_head`, and an
      # exact-hit restore of a shared key would never save those. e2e is the
      # flakiest job in the file — `cache-on-failure` keeps the warm cache
      # across red runs so retries don't recompile from cold.
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install Chromium runtime libs (linux only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libssl-dev lld \
            libnss3 libgbm1 libasound2t64 \
            libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libxcomposite1 libxdamage1 libxss1 \
            libxkbcommon-x11-0 libx11-xcb1 \
            fonts-liberation xdg-utils
      # See the test job for the rationale: lld + re-listed warning flags.
      # (Also applies to this job's dev-profile verify_url_head compile — harmless.)
      - name: Configure lld linker + preserve warning gate (linux only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          RF="-Dwarnings -Wunused -Clink-arg=-fuse-ld=lld"
          echo "$RF" | grep -q -- '-Dwarnings' || { echo "::error::RUSTFLAGS lost -Dwarnings"; exit 1; }
          echo "RUSTFLAGS=$RF" >> "$GITHUB_ENV"
      - name: Restore pinned-Chromium cache
        uses: actions/cache@v6
        with:
          path: ~/.config/loom/chromium
          key: chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('loom-cli/src/chromium_pin.rs') }}
      - name: Build binaries (ci-fast)
        # ci-fast (no fat LTO); e2e exercises real-Chromium behavior, not perf.
        run: cargo build --profile ci-fast
      - name: Run loom postinstall (downloads + verifies pinned Chromium)
        # Fail-closed: postinstall exits non-zero on SHA mismatch
        # (SR-CLI-04) or HTTP/zip error. No `continue-on-error` on this job.
        run: ./target/ci-fast/loom postinstall
      - name: Strip macOS quarantine (no-op if absent)
        if: matrix.os == 'macos-latest'
        run: xattr -dr com.apple.quarantine "$HOME/.config/loom/chromium" || true
      - name: Pinned binary launches and reports the expected version (linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -euo pipefail
          "$HOME/.config/loom/chromium/chrome-linux/chrome" --version | tee /tmp/chrome-version.txt
          grep -F '132.0.6834.57' /tmp/chrome-version.txt
      - name: Pinned binary launches and reports the expected version (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          set -euo pipefail
          # The macOS Chromium zip extracts under a `chrome-mac/` prefix
          # (sibling of the Linux `chrome-linux/` layout). Production
          # `chromium_resolver` falls back to /Applications when the
          # pinned bundle isn't at `<dir>/Chromium.app/...`; that
          # fallback is tracked separately for v0.9.x. The CI version
          # check just verifies the downloaded binary runs.
          "$HOME/.config/loom/chromium/chrome-mac/Chromium.app/Contents/MacOS/Chromium" --version | tee /tmp/chrome-version.txt
          grep -F '132.0.6834.57' /tmp/chrome-version.txt
      - name: Verify pinned URLs are still reachable (CDN drift detector)
        # Cheap HEAD-only test from chromium_pin.rs — catches CDN expiry
        # before a binary download is needed.
        env:
          LOOM_VERIFY_CHROMIUM_PINS: '1'
        run: cargo test -p loom-cli verify_url_head -- --nocapture

      # ─── tests/e2e/ shell harness ─────────────────────────────────────
      # The shell scripts under tests/e2e/ exercise every README-promised
      # feature end-to-end against real Chromium (just downloaded above)
      # and a local Python http.server fixture. Each script is self-contained
      # except for the daemon, which we start once below and reuse across
      # all three. Three suites — one per logical surface area — run as
      # separate steps so CI logs flag the failing area precisely:
      #   • run_e2e     — every CLI verb + replay equality + typed errors
      #                   + 4 parallel sessions + form flow + budget kill
      #   • run_load    — 8 concurrent sessions × 5 actions each
      #   • run_mcp     — MCP stdio transport (initialize / tools/list /
      #                   tools/call) end-to-end
      # run_real_world.sh hits saucedemo.com, the-internet.herokuapp.com,
      # and booking.com — those live in a separate scheduled workflow
      # because per-PR flakes from external sites would block merges.
      - name: Install e2e harness deps (linux only)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install -y jq
      - name: Pass Chromium-in-CI flags to the daemon (linux only)
        # GitHub Actions Linux runners run as an unprivileged user without
        # the kernel user-namespace privileges Chromium's sandbox needs,
        # so a sandboxed launch exits with code 1 immediately. The
        # `LOOM_CHROMIUM_EXTRA_FLAGS` env var (read by
        # `loom-shims::supervisor`) appends flags to the Chromium spawn,
        # and is the standard escape hatch for sandbox-less runtimes
        # (CI, Docker without --privileged, etc.). Real installs don't
        # need this. macOS doesn't either — the kernel sandbox just works.
        if: matrix.os == 'ubuntu-latest'
        run: echo "LOOM_CHROMIUM_EXTRA_FLAGS=--no-sandbox --disable-dev-shm-usage" >> "$GITHUB_ENV"
      - name: Start daemon for e2e harness
        shell: bash
        run: |
          set -euo pipefail
          # LOOM_UPLOAD_ROOT gates web.set_input_files (fail-closed when unset).
          # Point it at the e2e fixtures dir so run_e2e.sh Section 11b can upload
          # the committed fixture into a real <input type=file>.
          export LOOM_UPLOAD_ROOT="${GITHUB_WORKSPACE}/tests/e2e/fixtures"
          ./target/ci-fast/loom serve > /tmp/loom-daemon.log 2>&1 &
          # Poll until the daemon's RPC channel is reachable, capped at 30s.
          # `loom serve` spawns the daemon as a subprocess and exits, so we
          # can't block on the `serve` invocation itself.
          #
          # Readiness criterion: `daemon_responsive == ok` only. We
          # deliberately do NOT require `chromium_present_and_verified`,
          # because on macOS the postinstall layout
          # (`chrome-mac/Chromium.app/`) sits one directory deeper than
          # the daemon's pinned-binary resolver expects (the resolver
          # looks for `<dir>/Chromium.app/`), so the daemon falls back
          # to system Chrome and that doctor check goes red even though
          # the daemon is fully functional. The real chromium signal is
          # the `web.navigate` test in run_e2e.sh below — if Chrome
          # is genuinely unreachable, that step fails with a typed error
          # rather than this readiness gate timing out opaquely.
          for i in $(seq 1 30); do
            doc=$(./target/ci-fast/loom doctor 2>/dev/null || true)
            if [ -n "$doc" ] && echo "$doc" | jq -e '.checks[] | select(.name == "daemon_responsive") | .status == "ok"' >/dev/null; then
              echo "daemon RPC reachable after ${i}s"
              echo "doctor output: $doc"
              exit 0
            fi
            sleep 1
          done
          echo "::error::daemon RPC did not become reachable within 30s"
          echo "last doctor output: ${doc:-<empty>}"
          tail -50 /tmp/loom-daemon.log || true
          exit 1
      - name: e2e — full CLI surface coverage (run_e2e.sh)
        shell: bash
        run: bash tests/e2e/run_e2e.sh
      - name: e2e — concurrent-session load (run_load.sh)
        shell: bash
        run: bash tests/e2e/run_load.sh
      - name: e2e — MCP stdio transport (run_mcp.sh)
        shell: bash
        run: bash tests/e2e/run_mcp.sh
      - name: Dump e2e artefacts on failure
        if: failure()
        shell: bash
        run: |
          echo "::group::daemon log"
          tail -200 /tmp/loom-daemon.log || true
          echo "::endgroup::"
          if [ -d tests/e2e/results ]; then
            for f in tests/e2e/results/*; do
              echo "::group::$f"
              head -200 "$f" || true
              echo "::endgroup::"
            done
          fi
      - name: Upload e2e artefacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results-${{ matrix.os }}
          path: |
            tests/e2e/results/
            /tmp/loom-daemon.log
          if-no-files-found: ignore
          retention-days: 7

  # cargo-deny — license + advisory + supply-chain + ban audit on the workspace.
  # Scope per  ("license + duplicate-dep audit. Fail on any GPL /
  # unknown licenses.") plus the architectural bans encoded in `deny.toml`
  # (no chromiumoxide outside loom-shims; no platform keychain crates outside
  # loom-keychain; getrandom audit trail). The `bans` wrappers were rewritten
  # to enumerate direct dep-graph parents — cargo-deny v2 doesn't treat
  # transitive ancestors as wrappers.
  deny:
    name: cargo-deny
    needs: changes
    # The audited inputs (Cargo.toml/Cargo.lock/deny.toml/crate sources) are
    # all inside the rust filter group.
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    # cargo-deny-action runs `cargo metadata`, which probes `rustc -vV` THROUGH
    # the global RUSTC_WRAPPER. This job doesn't compile (it analyzes the dep
    # graph) and so doesn't install sccache — disable the wrapper here (cargo
    # treats an empty RUSTC_WRAPPER as "no wrapper").
    env:
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses advisories sources bans

  # vendored-wasm staleness check. The committed
  # `loom-cli/vendor/loom_surface_web.wasm` makes `cargo install --git`
  # Python SDK — pytest. Covers the hand-written admin wrappers
  # (Session.kill, kill_session, daemon_health) and the new
  # AsyncLoomTransport id-keyed demux + asyncio.CancelledError integration.
  # Hits a MockDaemon fixture; no real daemon spawn.
  python-sdk-tests:
    name: pytest (python-sdk)
    needs: changes
    # Filter includes the Rust wire-type files the drift tests parse — see
    # the `changes` job comment.
    if: github.event_name != 'pull_request' || needs.changes.outputs.python_sdk == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install python-sdk + dev deps
        working-directory: python-sdk
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run pytest
        working-directory: python-sdk
        run: pytest -q

  # TypeScript SDK — node:test via tsx. Covers the hand-written admin
  # wrappers (Session.kill, killSession, daemonHealth) and the new
  # LoomTransport id-keyed demux + AbortSignal cancellation. Hits a
  # MockDaemon fixture; no real daemon spawn.
  typescript-sdk-tests:
    name: node:test (typescript-sdk)
    needs: changes
    # Filter includes loom-shared/src/error_format.rs, which the TS drift
    # test parses — see the `changes` job comment.
    if: github.event_name != 'pull_request' || needs.changes.outputs.typescript_sdk == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # `node --test 'tests/**/*.ts'` relies on node-native glob
          # expansion (added in v21); node 22 LTS is the minimum that
          # matches the local dev environment's behaviour.
          node-version: "22"
      - name: Install deps
        working-directory: typescript-sdk
        # Strict `npm ci` (no `|| npm install` fallback): lockfile drift must
        # fail the PR that introduced it, not the tag-triggered publish-npm.yml
        # run (which also uses strict `npm ci`).
        run: npm ci
      - name: Typecheck
        working-directory: typescript-sdk
        run: npm run typecheck
      - name: Run tests
        working-directory: typescript-sdk
        run: npm test

  # work without `rustup target add wasm32-wasip2`. If the vendored bytes
  # drift from `loom-surface-web/` source, cargo-install users get stale
  # behavior. This job rebuilds from source and diffs.
  vendored-wasm-check:
    name: vendored-wasm staleness
    needs: changes
    # The vendored bytes are a pure function of Rust sources + Cargo.lock
    # (all inside the rust filter, including loom-cli/vendor/ itself via
    # loom-*/**) — SDK/docs/README-only PRs cannot introduce staleness.
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      # `cache-on-failure`: staleness failures happen *after* a successful
      # wasm build — keep the cache so the regen-and-recommit run is warm.
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Build wasm32-wasip2 from source
        run: |
          cargo build -p loom-surface-web \
            --target wasm32-wasip2 \
            --profile=wasm-guest \
            --target-dir target/wasm-guest
      - name: Diff against committed vendor copy
        id: diff
        run: |
          set -euo pipefail
          FRESH=target/wasm-guest/wasm32-wasip2/wasm-guest/loom_surface_web.wasm
          VENDORED=loom-cli/vendor/loom_surface_web.wasm
          if ! cmp -s "$FRESH" "$VENDORED"; then
            echo "::error::loom-cli/vendor/loom_surface_web.wasm is stale."
            echo "Run \`just vendor-wasm\` to regenerate, then commit."
            ls -la "$FRESH" "$VENDORED"
            exit 1
          fi
          echo "✓ vendored wasm matches source"
      - name: Upload fresh wasm on staleness (for cross-host regen)
        # Always runs (even on diff failure) so contributors on macOS /
        # WSL / etc. can download the Linux-built bytes from CI and commit
        # them, instead of needing a matching Linux toolchain locally.
        # Idempotent: the upload is just the freshly-compiled artifact.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vendored-wasm-fresh
          path: target/wasm-guest/wasm32-wasip2/wasm-guest/loom_surface_web.wasm
          if-no-files-found: warn
          retention-days: 7
