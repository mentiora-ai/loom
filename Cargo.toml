[workspace]
resolver = "2"
members = [
    "loom-shared",
    "loom-keychain",
    "loom-core",
    "loom-host",
    "loom-rpc",
    "loom-mcp",
    "loom-cli",
    "loom-daemon",
    "loom-shims",
    "loom-surface-web",
]

[workspace.package]
version = "0.15.3"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
authors = ["Mentiora <hi@mentiora.com>"]
repository = "https://github.com/mentiora-ai/loom"
homepage = "https://github.com/mentiora-ai/loom"
description = "Agent-first browser automation runtime — deterministic Chromium sessions with replay-equal hash chains, MCP-native tools, and a content-addressed action store."
keywords = ["browser", "automation", "agent", "chromium", "mcp"]
categories = ["command-line-utilities", "development-tools::testing", "web-programming"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"

# Serde + canonical-bytes serialization (manifests, receipts).
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_jcs = "0.2"

# WASM (loom-host only)
wasmtime = { version = "49", features = ["component-model", "async"] }
wasmtime-wasi = "48"
wit-bindgen = "0.61"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
gimli = "0.34"
addr2line = "0.27"
ciborium = "0.2"
base64 = "0.23"

# RPC
jsonrpsee = { version = "0.26", features = ["server", "client", "macros"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Chromium devtools (loom-shims only)
chromiumoxide = "0.9"

# Vault crypto (loom-core only)
ring = "0.17"
zeroize = { version = "1", features = ["derive"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# General
async-trait = "0.1"
dashmap = "6"
parking_lot = "0.12"
thiserror = "2"
anyhow = "1"
filetime = "0.2"
tempfile = "3"
ulid = "3"
walkdir = "2"
toml = "1"
uuid = { version = "1", features = ["v4", "serde"] }

# loom-rpc: auth + schema validation
rand = "0.10"
jsonschema = "0.52"
subtle = "2"
hex = "0.4"
sha2 = "0.11"
tar = "0.4"
flate2 = "1"
# zip 8's default features pull in `bzip2`, `lzma`, `xz`, `zstd`,
# `aes-crypto`, `deflate64`. We only need `deflate` (Playwright's
# Chromium download uses deflate-compressed entries) and `Stored` (zero
# compression, used by our test fixtures). bzip2's license
# (`bzip2-1.0.6`) is not on the deny.toml allow-list; disabling
# defaults keeps the workspace license-clean.
zip = { version = "8", default-features = false, features = ["deflate"] }
dirs = "6"
bytes = "1"
futures = "0.3"
humantime = "2"

# IPC + low-level (loom-host shim spawn site, loom-shims FD inheritance)
rustix = { version = "1", features = ["net", "process"] }
libc = "0.2"

# WebSocket — only as a dev-dep for the stub CDP harness.
# Not allowed in production code paths (cargo-deny enforced; chromiumoxide
# transitively pulls async-tungstenite for real CDP).
tokio-tungstenite = "0.30"

# Internal crates. `version = "0.15.3"` matches `[workspace.package].version`
# above; matters for cargo-deny's `bans.wildcards` check (path-only deps are
# treated as wildcards). Bump both in lockstep.
loom-shared = { path = "loom-shared", version = "0.15.3" }
loom-keychain = { path = "loom-keychain", version = "0.15.3" }
loom-core = { path = "loom-core", version = "0.15.3" }
loom-host = { path = "loom-host", version = "0.15.3" }
loom-rpc = { path = "loom-rpc", version = "0.15.3" }
loom-mcp = { path = "loom-mcp", version = "0.15.3" }
loom-daemon = { path = "loom-daemon", version = "0.15.3" }
loom-shims = { path = "loom-shims", version = "0.15.3" }

# Workspace-wide lint policy. Each member crate opts in via `[lints] workspace = true`
# so a future addition to this list propagates without per-crate edits. The CI
# clippy job pins `dtolnay/rust-toolchain@stable` (≥ 1.95), so allow-list anything
# that's stylistic-only or that the workspace deliberately uses.
[workspace.lints.clippy]
# loom-core uses the `mod foo/foo.rs` re-export pattern intentionally for its
# domain modules (15 occurrences). Renaming would touch every public re-export
# path in the lib. Stylistic, not load-bearing.
module_inception = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# wasm-guest: compile profile for the loom-surface-web cdylib invoked
# recursively from loom-cli/build.rs. Wasmtime AOT-compiles the cdylib
# at postinstall time, so fat-LTO on the guest is wasted work and adds
# 45-90s to every cold loom-cli build. lto=false + codegen-units=16
# brings cold wasm-guest builds to ~10s.
[profile.wasm-guest]
inherits = "release"
lto = false
codegen-units = 16

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# ci-fast: the CI test/build/smoke/e2e compile profile. Same optimization as
# release (opt-level=3 inherited) so the wall-clock perf-SLA tests still pass
# (audit p95<100ms, replay<5s, session-list<500ms, …), but WITHOUT fat LTO —
# the `cargo test (ubuntu)` job spent ~35 min running 373 single-threaded
# whole-program LTO passes (one per test binary). lto=false + codegen-units=16
# restores codegen parallelism; same lever the wasm-guest profile uses. NOT for
# shipped artifacts — release.yml/cargo-dist build from [profile.dist] (lto=thin).
[profile.ci-fast]
inherits = "release"
lto = false
codegen-units = 16
