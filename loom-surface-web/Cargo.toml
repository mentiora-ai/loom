[package]
name = "loom-surface-web"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = { workspace = true }
# default-features = false drops the asm path that won't link on
# wasm32-wasip2; only the Sha256 Digest API is needed by the guest.
# Pinned via version (not workspace = true) because the workspace
# declaration uses default features for host crates.
sha2 = { version = "0.11", default-features = false }

[lints]
workspace = true
