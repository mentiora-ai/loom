[package]
name = "loom-cli"
# crates.io decision (onboarding-friction-audit AC7): loom is NOT published to
# crates.io. `loom` is the tokio-rs concurrency crate and both `loom-cli` and
# our internal `loom-core` names are already owned by an unrelated third party,
# so a real publish would require renaming + republishing the whole ~10-crate
# workspace under a namespace — out of proportion to the benefit when the binary
# already installs via Homebrew, the release installer script, and
# `cargo install --git … --tag`. `publish = false` is the guard that encodes
# that decision: it makes `cargo publish` refuse, so no release can leak a crate
# to crates.io by accident. See the per-ecosystem install table in README.md.
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
loom-shared = { workspace = true }
loom-core = { workspace = true }
loom-rpc = { workspace = true }
loom-host = { workspace = true, optional = true }
# loom-daemon, loom-mcp, loom-shims are added as deps so the `[[bin]]`
# entries for loom-daemon, loom-mcp, loom-shim-chromium (in `src/bin/`)
# can call into their library code. cargo-dist 0.30+ requires all
# `[[bin]]` entries to live in one Cargo Package to bundle them into
# one tarball / one brew formula.
loom-daemon = { workspace = true }
loom-mcp = { workspace = true }
loom-shims = { workspace = true }
anyhow = { workspace = true }

tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_jcs = { workspace = true }
async-trait = { workspace = true }
parking_lot = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
ulid = { workspace = true }
jsonschema = { workspace = true }
dirs = { workspace = true }
walkdir = { workspace = true }
hex = { workspace = true }
toml = { workspace = true }
sha2 = { workspace = true }
zip = { workspace = true }
humantime = { workspace = true }

# macOS-only: `loom doctor`'s quarantine probe reads the
# `com.apple.quarantine` xattr via `libc::getxattr` (no subprocess).
[target.'cfg(target_os = "macos")'.dependencies]
libc = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true }
# tar + flate2: integration_export_tarball_manifest unpacks the
# `session export --format tarball` artifact to assert its manifest.json
# matches the json export (same crates the exporter itself uses).
tar = { workspace = true }
flate2 = { workspace = true }
# integration_reaper.rs checks orphan-process liveness via libc::kill(pid, 0) on
# every platform (the production macos-only libc dep above doesn't cover Linux tests).
libc = { workspace = true }
# wasmparser: validate the embedded loom_surface_web.wasm is a real wasm
# component (not the dev stub) in the non-ignored embedded_wasm_sha test.
# Not lockstep-shared with wasmtime's transitive (wasmtime 44 ships 0.246.x);
# this dev-dep keeps an independent lock entry. Tracked as a follow-up to
# pin to whatever wasmtime brings transitively for compile-time savings.
wasmparser = "0.256"
# clap_mangen: used only by examples/gen-docs.rs to render `loom.1`
# and per-subcommand man pages from the clap derive; not in the
# production binary.
clap_mangen = "0.3"

# macOS-only: `integration_doctor_quarantine` sets the
# `com.apple.quarantine` xattr via `libc::setxattr` to exercise the
# doctor probe end-to-end.
[target.'cfg(target_os = "macos")'.dev-dependencies]
libc = { workspace = true }

[features]
# `postinstall` enabled by default so `cargo build --release --bin loom`
# produces a binary with a fully-functional `loom postinstall`.
# `compile_module` stays reachable only from `Command::Postinstall →
# postinstall_runner::compile_step`, never from the action dispatch path.
#
# `vendored-wasm` lets `cargo install --git ... loom-cli` succeed without
# `rustup target add wasm32-wasip2`. build.rs reads
# `vendor/loom_surface_web.wasm` instead of recursively building the
# wasm32-wasip2 cdylib. CI guards staleness via the `vendored-wasm-check`
# job in ci.yml.
default = ["postinstall", "vendored-wasm"]
mock = []
postinstall = ["dep:loom-host"]
vendored-wasm = []
# v0.9.6 web-cookie-injection: opt-in end-to-end stdio MCP acceptance
# test. Spawns the loom-mcp binary as a subprocess, drives JSON-RPC
# over its stdio, and exercises the cookie verb chain. Browser-
# requiring sub-tests further check LOOM_TEST_CHROMIUM_AVAILABLE=1
# in the environment; non-browser sub-tests run under
# `cargo test --features e2e -p loom-cli --test cookie_injection_acceptance`.
e2e = []

# Binary crate that also exposes a library facade for integration tests
# (`fn main()` plus a library-style `run` helper).
[lib]
name = "loom_cli"
path = "src/lib.rs"

[[bin]]
name = "loom"
path = "src/bin/loom.rs"

# 3 sibling binaries co-located in this package so cargo-dist 0.30+
# ships them in one tarball + one brew formula.
[[bin]]
name = "loom-daemon"
path = "src/bin/loom-daemon.rs"

[[bin]]
name = "loom-mcp"
path = "src/bin/loom-mcp.rs"

[[bin]]
name = "loom-shim-chromium"
path = "src/bin/loom-shim-chromium.rs"

# `publish = false` (above) hides this package's binaries from cargo-dist, which
# would leave the workspace with nothing to release (the sibling bin crates all
# set `dist = false` — their binaries are bundled here). `dist = true` re-opts
# this package into the release pipeline: cargo-dist still builds + ships the
# four binaries via the shell installer and Homebrew formula, independent of the
# crates.io publish decision.
[package.metadata.dist]
dist = true

[lints]
workspace = true
